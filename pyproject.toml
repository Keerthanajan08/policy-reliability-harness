[project]
name = "policy-reliability"
version = "0.1.0"
description = "Train robot-learning policies from demonstrations, evaluate them with paired statistics, and diagnose why they fail."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
