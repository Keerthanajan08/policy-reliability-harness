name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Metrics, reports and the imitation-learning logic don't need the simulator,
      # LeRobot or a GPU, so CI stays fast and CPU-only.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy matplotlib pytest ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/test_metrics.py tests/test_report.py tests/test_imitation.py
